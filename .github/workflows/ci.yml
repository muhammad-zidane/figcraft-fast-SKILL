name: CI

on:
  push:
    branches: [master, "update/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile-check Python modules
        run: |
          python -m py_compile scripts/figcraft_ui.py scripts/design_tokens.py scripts/figcraft_components.py scripts/smoke_test.py examples/build_berrycrumb_screens.py examples/login_web_blue.py

      - name: Run unit test suite
        run: |
          python -m unittest discover -s scripts -p "test_*.py" -v
